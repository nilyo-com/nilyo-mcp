interface:
  display_name: "Message contacts with Nilyo"
  short_description: "Send WhatsApp, Telegram, Instagram or LinkedIn messages to a contact by name, from your own accounts."
  icon_small: "./assets/icon.png"
  icon_large: "./assets/logo.png"
  brand_color: "#25D366"
  default_prompt: "Send a WhatsApp to Julien saying I'll be 10 minutes late."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "Nilyo"
