interface:
  display_name: "LinkedIn content & engagement with Nilyo"
  short_description: "Publish posts, comment, react and follow what your network and prospects publish, from your own LinkedIn."
  icon_small: "./assets/icon.png"
  icon_large: "./assets/logo.png"
  brand_color: "#0A66C2"
  default_prompt: "Show me the latest posts from my top prospects and draft a thoughtful comment for each."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "Nilyo"
